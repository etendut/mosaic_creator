name: Deploy to GitHub Pages

# Publishes the single-file build to https://<owner>.github.io/<repo>/ on every push to main, by committing it to the
# gh-pages branch. Needs Settings → Pages → Source set to "Deploy from a branch", gh-pages, / (root).
# PR previews live in pr-preview/ on the same branch (see preview.yml), so a deploy leaves that folder alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# shared with preview.yml: both push to gh-pages, one at a time, and never cancel a push in progress
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # serve files as they are, without a Jekyll build
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean-exclude: pr-preview/
