name: CodeQL

# GitHub's code scanning: finds security problems and code-quality issues in the app's TypeScript and in these
# workflows, and annotates PRs with what it finds. Results are under Security > Code scanning.
# Runs on PRs to main, on pushes to main, and weekly, so newly published queries check unchanged code too.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '22 0 * * 2'

# a new push to a PR replaces its scan in progress
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # neither needs a build: CodeQL reads the source directly
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # the default security queries plus the code-quality ones (dead code, unused variables, suspicious logic)
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
