name: PR preview

# Publishes each PR's build to https://<owner>.github.io/<repo>/pr-preview/pr-<number>/ and links it in a PR comment.
# The preview updates on every push to the PR and is removed when the PR is merged or closed.
# PRs from forks can't write to gh-pages, so they get no preview; CI still uploads their build as an artifact.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

# shared with deploy.yml: both push to gh-pages, one at a time, and never cancel a push in progress
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
