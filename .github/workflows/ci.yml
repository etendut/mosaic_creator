name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: mv dist/index.html dist/mosaic-creator.html
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-creator
          path: dist/mosaic-creator.html
