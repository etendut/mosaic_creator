name: CI

on:
  push:
    branches: [main]
  pull_request:

# only reads the code; the build is uploaded as an artifact, which needs no token permission
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # a PR's build is a preview of the version it gets on merge (empty on a push to main)
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: mv dist/index.html dist/mosaic-creator.html
      - uses: actions/upload-artifact@v7
        with:
          name: mosaic-creator
          path: dist/mosaic-creator.html
