# Dependabot version updates: a weekly PR for npm packages and one for the GitHub Actions the workflows use.
# Updates are grouped so a week's bumps arrive as one or two PRs, not one per package; each still has to pass the
# `build` check before it can be merged.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # minor and patch releases together; a major release (breaking changes) gets its own PR
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
